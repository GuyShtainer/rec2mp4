#
# rec2mp4 CI — everything here runs WITHOUT any game data.
#
# The full emulator replay (boot ROM -> menu-drive -> play back the record ->
# encode) is user-asset-gated by design: it needs a US Emerald ROM, a
# post-game save and real .rec files, none of which are (or ever will be)
# committed — local/ is gitignored. That end-to-end path therefore stays OUT
# of CI and is validated manually (see README "Status"). What CI covers:
#
#   tests    — the parser/validator/injector suite (tests/test_rec.py) on all
#              three OSes. With no local/ assets the suite runs its FULL set
#              of sections on a synthetic record + save ("SYNTHETIC MODE",
#              exit 0); exit 2 would mean a vacuous run and fails the job.
#              Plus the naming/sidecar suite (tests/test_naming.py), whose
#              asset-free sections always run; its ROM ground-truth section
#              skips cleanly with exit 0 when local/rom.gba is absent. And the
#              party-mon decode suite (tests/test_decode.py): its asset-free
#              guard for the speed<->spAttack EV/IV mapping, the 5-bit IV
#              unpack, nature=%25 and the POV name injection runs in every
#              asset-free run ("SYNTHETIC MODE", exit 0); the real-record/ROM
#              cross-check runs only when local/ assets are present. And the
#              panel-layout suite (tests/test_layout.py): the layout model +
#              JSON round trip, the composite geometry every scale must keep
#              even, the hstack/vstack filter graph for all four sides, the
#              designer's drag/hit-test maths, the parallel batch's
#              output-name reservation, and PokeDNA's 'state.*' sidecar
#              rules — all asset-free (its Pillow render checks skip cleanly
#              where Pillow is absent). And the packaging suite
#              (tests/test_packaging.py): the generated app icon at every
#              size, the hand-written multi-size .ico container, the macOS
#              .app bundle (macOS runner only) and the Windows launcher
#              scripts as text — all asset-free.
#   encoder  — the real ffmpeg encode path: rec2mp4/video.py's self-test
#              pipes synthetic frames + PCM through ffmpeg and verifies the
#              result with ffprobe (codecs, geometry, duration, temp cleanup).
#   bindings — Windows + macOS: tools/fetch_bindings.py downloads the
#              prebuilt hanzi/libmgba-py 0.2.0-2 zip into vendor/ and ends
#              with an `import mgba.core` smoke test, so the Windows
#              emulator-import path is exercised on every push.

name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: parser / validator / injector suite (synthetic mode in CI)
        run: python tests/test_rec.py
      - name: naming / romdata / sidecar suite (asset-free sections)
        run: python tests/test_naming.py
      - name: panel / species / streak-stem / pipeline suite
        run: python tests/test_panel.py
      - name: opponent-POV transform / naming / sidecar suite (asset-free)
        run: python tests/test_pov.py
      - name: party-mon decode suite — EV/IV speed<->spAttack guard (synthetic mode in CI)
        run: python tests/test_decode.py
      - name: GUI pure-logic suite (widget smoke skips headless)
        run: python tests/test_gui.py
      - name: panel-layout / designer / parallel-batch / state-sidecar suite
        run: python tests/test_layout.py
      - name: desktop-icon packaging suite (icon draw, .ico, .app, launchers)
        run: python tests/test_packaging.py

  encoder:
    name: encoder self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: video.py self-test (real encode, verified with ffprobe)
        run: python -m rec2mp4.video

  bindings:
    name: mGBA bindings fetch + import (${{ matrix.os }})
    timeout-minutes: 20
    # The macOS prebuilt _pylib.abi3.so is linked against one specific brew
    # ffmpeg ABI (libavcodec.62 = ffmpeg 8); the runner's brew ffmpeg may be
    # another major, so the macOS import smoke is ADVISORY (Windows is the
    # self-contained zip and stays blocking). The listing below says which
    # libavcodec the runner actually has when the import fails.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The macOS bindings dynamically link brew's libmgba.0.10.dylib; the
      # win64 zip is self-contained (mgba.dll + dependency DLLs bundled).
      # The prebuilt macOS _pylib.abi3.so also links brew's ffmpeg
      # (libavcodec.62.dylib), so ffmpeg must be installed next to mgba.
      - name: install libmgba + ffmpeg (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install mgba ffmpeg
          ls /opt/homebrew/opt/ffmpeg/lib | grep -E '^libavcodec\.[0-9]+\.dylib$' || true
      - name: install cffi (the bindings' runtime dependency)
        run: python -m pip install cffi
      - name: fetch prebuilt bindings into vendor/ + import smoke test
        run: python tools/fetch_bindings.py
