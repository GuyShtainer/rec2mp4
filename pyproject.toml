[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rec2mp4"
version = "1.0.0"
description = "Convert Pokémon Emerald Battle Record (.rec) files into MP4 videos by replaying them in the real engine under mGBA"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"

[project.scripts]
rec2mp4 = "rec2mp4.__main__:main"

[project.gui-scripts]
rec2mp4-gui = "rec2mp4.gui:main"
rec2mp4-designer = "rec2mp4.designer:main"

[tool.setuptools.packages.find]
include = ["rec2mp4*"]
